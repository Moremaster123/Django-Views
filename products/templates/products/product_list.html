<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>
    <h1>Lista de productos</h1>
    <a href="{% url 'product-create' %}">Crear producto</a>
    <ul>
        {% for product in products %}
            <li>
                <a href="{% url 'product-detail' product.id %}">{{ product.title }}</a> - ${{ product.price }}
            </li>
        {% empty %}
            <li>No hay productos todavía.</li>
        {% endfor %}
    </ul>
</body>
</html>
