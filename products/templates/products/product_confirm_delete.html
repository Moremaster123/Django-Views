<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar producto</title>
</head>
<body>
    <h1>Eliminar producto</h1>
    <p>¿Seguro que quieres eliminar "{{ product.title }}"?</p>
    <p>Vendedor: {{ product.seller }} | Color: {{ product.color }}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <a href="{% url 'product-detail' product.id %}">Cancelar</a>
</body>
</html>
